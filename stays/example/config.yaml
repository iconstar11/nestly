# ── CLIENT CONFIG ──────────────────────────────────────────────────────────
# Fill this in from the property owner's details + call notes.
# Run: python generate.py stays/example
# ───────────────────────────────────────────────────────────────────────────

property_name: "Westlands Cozy Studio"
tagline: "Fully furnished, fast WiFi, 5 min from 2 Rivers Mall"
property_type: "Furnished studio"

# Location
area: "Westlands"
city: "Nairobi"
street_address: "Waiyaki Way"   # general area is fine, no need for exact address

# Landmarks — these are what people type into Google
landmarks:
  - "2 Rivers Mall"
  - "Westgate Mall"
  - "ABC Place"
  - "Sarit Centre"
  - "Westlands CBD"

# Extra keywords for SEO meta tag (comma-separated, no quotes needed)
extra_keywords: "short stay nairobi, furnished apartment westlands, guest accommodation nairobi"

# Description shown in Google search results (keep under 155 chars)
meta_description: "Cozy furnished studio in Westlands, Nairobi. 5 min from 2 Rivers Mall. Fast WiFi, full kitchen, secure parking. Enquire directly on WhatsApp."

# Location paragraph shown on page
location_description: >
  Tucked in the heart of Westlands, just 5 minutes from 2 Rivers Mall and a short
  drive from Westgate and Sarit Centre. Easy access to the Nairobi Expressway.

# Pricing
price_per_night: 7500
currency: "KES"
min_nights: 1

# Images — use direct URLs from the owner or uploaded files
hero_image: "https://example.com/images/hero.jpg"
extra_images:
  - "https://example.com/images/living.jpg"
  - "https://example.com/images/bedroom.jpg"
  - "https://example.com/images/kitchen.jpg"
  - "https://example.com/images/bathroom.jpg"
# Alt text for each image above, in the same order (optional)
image_alt_text:
  - "Living area with sofa and TV"
  - "Bedroom with double bed"
  - "Kitchen with full equipment"
  - "Bathroom with hot shower"

# Amenities (keep it to 8–12 items)
amenities:
  - "Free WiFi (50 Mbps)"
  - "Full kitchen"
  - "Smart TV with streaming apps"
  - "Hot shower"
  - "Air conditioning"
  - "Secure parking"
  - "Washing machine"
  - "24/7 security"

# House rules (optional — included in the Professional package)
house_rules:
  - "Check-in from 2 PM, check-out by 10 AM"
  - "No smoking inside"
  - "Quiet hours 10 PM – 7 AM"
  - "No parties or events"

# FAQs (optional — included in the Professional package)
faqs:
  - q: "How far is the nearest mall?"
    a: "2 Rivers Mall is a 5-minute drive away."
  - q: "Is parking available?"
    a: "Yes, secure on-site parking is included."

# Contact & enquiry
phone: "+254 712 345 678"
whatsapp: "254712345678"   # no + or spaces
email: ""

# Optional external availability link (leave empty to hide the button)
external_reservation_url: ""
external_reservation_label: "Check availability"

# Domain & email (set after purchase; kept empty until configured)
client_domain: ""
branded_email: ""
email_provider: ""
email_setup_included: true

# Canonical URL (set to the live page URL once deployed)
canonical_url: ""
